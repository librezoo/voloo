[package]
name = "voloo"
version = "0.7.0-rc.5"
edition = "2024"
rust-version = "1.89"
description = "Local host software for the USB-C Voloo Switch"
publish = false
license = "Apache-2.0"
repository = "https://github.com/librezoo/voloo"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10"
thiserror = "2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
