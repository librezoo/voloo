name: Release
# Push a tag vX.Y.Z (equal to the version in Cargo.toml) to build every platform and,
# after approval of the `release` environment, publish to npm and a GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release # add required reviewers to this environment for a manual gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Check tag, version and files
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist/npm dist/pypi
          test "$(ls dist/npm/librezoo-voloo-*.tgz | wc -l)" = 6
      - name: Obtain and inspect the paired encrypted firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/firmware dist/firmware-client
          # The publisher stages only ciphertext in this draft before tagging.
          gh release download "$GITHUB_REF_NAME" --pattern voloo-switch-x035.voloofw --dir dist/firmware
          tar -xzf "dist/npm/librezoo-voloo-linux-x64-$VERSION.tgz" -C dist/firmware-client
          dist/firmware-client/package/bin/voloo --json firmware inspect dist/firmware/voloo-switch-x035.voloofw
      - name: Make the complete release downloadable before npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber dist/npm/*.tgz dist/pypi/*.whl
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          # Check the unauthenticated URL used by installed clients before npm
          # users receive this version. Draft asset access alone is insufficient.
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 30 --retry 3 \
            --output dist/firmware/public.voloofw \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/voloo-switch-x035.voloofw"
          dist/firmware-client/package/bin/voloo --json firmware inspect dist/firmware/public.voloofw
      - name: Publish platform packages, then the main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node packaging/npm/publish.mjs "$VERSION"
      - name: Check a clean registry install before advancing the default app version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          install_root=$(mktemp -d)
          trap 'rm -rf "$install_root"' EXIT
          # npm can acknowledge publication before registry reads see it.
          # Each attempt has a fresh prefix so optional-dependency misses cannot
          # leave a partial installation for the next verification.
          for attempt in {1..20}; do
            install_dir="$install_root/attempt-$attempt"
            if npm install --prefix "$install_dir" --ignore-scripts --prefer-online "@librezoo/voloo@$VERSION" \
              && "$install_dir/node_modules/.bin/voloo" --version \
              && "$install_dir/node_modules/.bin/voloo" firmware update --help; then
              npm dist-tag add "@librezoo/voloo@$VERSION" latest
              exit 0
            fi
            test "$attempt" -lt 20 || exit 1
            sleep 15
          done
