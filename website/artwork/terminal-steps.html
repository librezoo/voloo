rid-template-columns:180px 1fr;align-items:center;gap:22px;background:#fffdf8;border-radius:18px;padding:18px;margin-top:20px}.remove img{width:180px}.code{background:#241622;color:#fffdf8;border-radius:14px;padding:18px 20px;margin:12px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.code code{font:15px/1.7 ui-monospace,monospace;overflow-wrap:anywhere}.code button{font:inherit;line-height:1.2;min-height:44px;background:transparent;color:inherit;border:1px solid #8b7b88;border-radius:9px;padding:9px 13px;cursor:pointer;flex:none}ol{padding-left:24px}li+li{margin-top:12px}.faq{display:grid;gap:14px}.faq article{padding:16px 20px;background:#fffdf8;border:1px solid #ddd2da;border-radius:14px}.faq h3{font-size:18px}footer{margin-top:38px;padding-top:20px;border-top:1px solid #d8cdd5;font-size:14px;color:#65545f}.links{display:flex;gap:18px;flex-wrap:wrap}small{font-size:13px;color:#65545f}.download{display:inline-block;background:#fec600;padding:10px 18px;border-radius:12px;font-weight:700;text-decoration:none;color:#2d1a2b;margin-top:14px}@media(max-width:650px){main{padding:18px 18px 44px}header{flex-wrap:wrap;gap:12px}h1{font-size:31px}.hero{grid-template-columns:1fr;padding:18px}.hero>img{max-width:420px;margin:auto}.steps{grid-template-columns:1fr}.step{display:grid;grid-template-columns:116px 1fr;gap:10px;padding:15px}.step img{height:135px}.step h3{font-size:18px}.step p{font-size:15px}.remove{grid-template-columns:105px 1fr;gap:12px}.remove img{width:105px}.code code{font-size:12px}.code{padding:14px}.specs b{font-size:17px}.intro{font-size:17px}}body{width:1200px;background:#fffdf8}main{max-width:none;padding:36px}.steps{grid-template-columns:repeat(4,1fr);gap:14px}.step{padding:14px}.step img{height:175px}h1{font-size:34px;margin:0 0 12px}.step h3{font-size:20px}.step p{font-size:17px;line-height:1.65}.note{font-size:20px;margin-top:22px}</style></head><body><main id="terminal-figure"><h1>端子接线：按住橙色件，线进绿色圆孔</h1><p class="note">先确认断电，再接线或取线；图示为单孔操作，不表示固定极性。</p><div class="steps"><article class="step"><img src="../site/assets/guide/terminal-step-0.svg" alt="剥线 11 mm操作示意"><div><h3><span>1</span>剥线 11 mm</h3><p>未处理导线用剥线钳剥线 11 mm。
预制端头先匹配，线芯齐整不散。</p></div></article><article class="step"><img src="../site/assets/guide/terminal-step-1.svg" alt="按住橙色件操作示意"><div><h3><span>2</span>按住橙色件</h3><p>按住对应的橙色按压件，方向朝电路板，夹口随之打开。</p></div></article><article class="step"><img src="../site/assets/guide/terminal-step-2.svg" alt="插入绿色圆孔操作示意"><div><h3><span>3</span>插入绿色圆孔</h3><p>持续按住，把导线插入相邻的绿色圆孔；铜芯完全进入夹持区。</p></div></article><article class="step"><img src="../site/assets/guide/terminal-step-3.svg" alt="松开，轻拉确认操作示意"><div><h3><span>4</span>松开，轻拉确认</h3><p>松开橙色件后轻拉导线，确认夹紧；孔外不露铜。</p></div></article></div><p class="note"><b>取线：</b>断电后，按住对应橙色件，再沿进线孔方向取出；不要硬拽或撬动。</p><p class="note">剥线 11 mm 依据 KEFA KF142V-5.08 图纸。整机最高建议 3 A；超过可能损坏硬件。</p></main></body></html>
