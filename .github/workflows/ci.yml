name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          # Built on 22.04 so the executables run on glibc 2.35 and newer.
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: win32-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Linux serial-port prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Formatting and lints
        if: matrix.target == 'linux-x64'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (simulated devices only)
        # One test at a time: every test drives simulated serial ports with real timing (150 ms
        # reply budget), and parallel tests starve each other on 4-core runners.
        run: cargo test --locked -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: npm packages
        run: node packaging/npm/build.mjs --skip-build
      - name: Python wheel
        shell: bash
        run: |
          python -m pip install uv
          cd packaging/pypi
          uvx maturin==1.15.0 build --release --auditwheel skip --out ../../dist/pypi
      - name: Isolated install check
        if: runner.os != 'Windows'
        run: sh packaging/check-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            dist/npm/*.tgz
            dist/pypi/*.whl
          if-no-files-found: error
