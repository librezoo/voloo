server {
    listen 80;
    listen [::]:80;
    server_name voloo.librezoo.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://voloo.librezoo.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voloo.librezoo.com;
    ssl_certificate /etc/letsencrypt/live/voloo.librezoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voloo.librezoo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/voloo/current;
    index index.html;
    access_log /var/log/nginx/voloo.librezoo.com.access.log;
    error_log /var/log/nginx/voloo.librezoo.com.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
